name: jacoco

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare mvnw
        run: chmod +x ./mvnw

      - name: Build and generate coverage
        run: ./mvnw clean jacoco:prepare-agent test jacoco:report -pl annotation-processor -B

      - name: Generate JaCoCo badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: annotation-processor/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update coverage badge"
          file_pattern: '.github/badges/*.svg'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload coverage report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: annotation-processor/target/site/jacoco

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
